<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sto lat Madzia!</title>
<style>
body {
    font-family: 'Poppins', sans-serif;
    background: #f2f2f7;
    text-align: center;
    padding: 40px 20px;
    color: #000000;
    background-image: url(louder.jpg);
    background-size: cover;
    background-position: start;
    background-repeat: no-repeat;
}

h1 {
    font-size: 2em;
    margin-bottom: 40px;
    color: #222;
}

/* Kontener siatki */
.sliders-container {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 100px;
    justify-items: center;
    align-items: end;
}

.slider-wrapper {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 80px;
}

/* Slider pionowy */
.slider {
    display: flex;
    flex-direction: column-reverse;
    align-items: center;
    position: relative;
}


/* Suwak */
.slider .level {
    -webkit-appearance: none;
    width: 120px;
    height: 16px;
    transform: rotate(270deg);
    background: linear-gradient(135deg, #d9d9d9, #ff0000);
    border-radius: 6px;
    box-shadow: inset 2px 2px 5px rgba(0,0,0,0.15);
    cursor: pointer;
    transition: box-shadow 0.2s, background 0.2s;
}

/* Suwak Webkit */
.slider .level::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 24px;
    height: 24px;
    background: linear-gradient(145deg, #ffffff, #e6e6e6);
    border: 2px solid #aaa;
    border-radius: 50%;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    transition: transform 0.1s;
}

.slider .level::-webkit-slider-thumb:hover {
    transform: scale(1.1);
}

/* Suwak Mozilla */
.slider .level::-moz-range-thumb {
    width: 24px;
    height: 24px;
    background: linear-gradient(145deg, #ffffff, #e6e6e6);
    border: 2px solid #aaa;
    border-radius: 50%;
    box-shadow: 2px 2px 5px rgba(0,0,0,0.3);
    transition: transform 0.1s;
}

.slider .level::-moz-range-thumb:hover {
    transform: scale(1.1);
}

/* Wyciszone slider - ikona ciemnieje */
.slider.muted .volume {
    color: #bbb;
}

#next {
    display: none;
}

button {
  /* Variables */
  --button_radius: 0.75em;
  --button_color: #e8e8e8;
  --button_outline_color: #000000;
  font-size: 17px;
  font-weight: bold;
  border: none;
  cursor: pointer;
  border-radius: var(--button_radius);
  background: var(--button_outline_color);
}

.button_top {
  display: block;
  box-sizing: border-box;
  border: 2px solid var(--button_outline_color);
  border-radius: var(--button_radius);
  padding: 0.75em 1.5em;
  background: var(--button_color);
  color: var(--button_outline_color);
  transform: translateY(-0.2em);
  transition: transform 0.1s ease;
}

button:hover .button_top {
  /* Pull the button upwards when hovered */
  transform: translateY(-0.33em);
}

button:active .button_top {
  /* Push the button downwards when pressed */
  transform: translateY(0);
}

/* Responsywność */
@media (max-width: 900px) {
    .sliders-container {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 600px) {
    .sliders-container {
        grid-template-columns: repeat(2, 1fr);
    }
}

#number {
    display: none;
    margin-top: 50px;
    font-size: 2em;
    color: #222;
    font-weight: 600;
}

</style>
</head>
<body>

<h1>Ustaw odpowiednio wszystkie suwaki</h1>
<br><br><br><br>
<div class="sliders-container">
  <!-- Powiel 10 sliderów -->
  <div class="slider-wrapper">
    <label class="slider">
      <input type="range" class="level" min="0" max="10" value="5">
      
    </label>
  </div>

  <div class="slider-wrapper"><label class="slider"><input type="range" class="level" min="0" max="10" value="5"></label></div>

  <div class="slider-wrapper"><label class="slider"><input type="range" class="level" min="0" max="10" value="5"></label></div>

  <div class="slider-wrapper"><label class="slider"><input type="range" class="level" min="0" max="10" value="5"></label></div>

  <div class="slider-wrapper"><label class="slider"><input type="range" class="level" min="0" max="10" value="5"></label></div>

  <div class="slider-wrapper"><label class="slider"><input type="range" class="level" min="0" max="10" value="5"></label></div>

  <div class="slider-wrapper"><label class="slider"><input type="range" class="level" min="0" max="10" value="5"></label></div>

  <div class="slider-wrapper"><label class="slider"><input type="range" class="level" min="0" max="10" value="5"></label></div>

  <div class="slider-wrapper"><label class="slider"><input type="range" class="level" min="0" max="10" value="5"></label></div>

  <div class="slider-wrapper"><label class="slider"><input type="range" class="level" min="0" max="10" value="5"></label></div>
</div>

<h2 id="number">Twoja druga liczba to <strong> 3 </strong> <br> łatwo poszło..</h2>

        

<script>
const sliders = document.querySelectorAll(".level");
const number = document.getElementById("number");
const next = document.getElementById("next");

function checkSliders() {
    const allMuted = Array.from(sliders).every(slider => parseInt(slider.value) === 0);
   

    if(allMuted != 0) {
        alert("Twoja liczba to 3!")
        window.location.href = "memory.html";
    }
    

    // dodanie klasy .muted dla ikon
    sliders.forEach(slider => {
        if(parseInt(slider.value) === 0){
            slider.closest('.slider').classList.add('muted');
        } else {
            slider.closest('.slider').classList.remove('muted');
        }
    });
}

sliders.forEach(slider => slider.addEventListener("input", checkSliders));
</script>

</body>
</html>
